name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装测试依赖
        run: npm ci --prefix test
      - name: 端到端测试（jsdom 执行真实脚本体 + Mock MCP）
        run: node test/e2e.mjs
